name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke-test release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/roll"
          "$binary" --help
          "$binary" --version
          "$binary" 2d6+3 --stats
      - name: Smoke-test release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/roll.exe"
          & $binary --help
          & $binary --version
          & $binary 2d6+3 --stats
      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf "dist/roll-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" roll
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/${{ matrix.target }}/release/roll.exe -DestinationPath dist/roll-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roll-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum roll-* > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "rollcli $TAG"
          fi
