name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo package --no-verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf "dist/roll-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" roll
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/${{ matrix.target }}/release/roll.exe -DestinationPath dist/roll-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roll-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum roll-* > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "rollcli $TAG"
          fi
